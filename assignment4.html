<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maple Leaf Member Registration</title>
    <link rel="stylesheet" href="assignment4.css">
</head>
<body>
    <div class="page-wrapper">
        <header class="hero-banner">
            <div class="hero-overlay">
                <div class="hero-content">
                    <h1>Maple Leaf Member Registration</h1>
                    <p>Join our community by completing the registration form below</p>
                </div>
            </div>
        </header>

        <main class="content-area">
            <section class="intro-card">
                <h2>Registration Form</h2>
                <p>Please complete all required fields carefully.</p>
            </section>

            <section class="form-card">
                <form id="registrationForm" novalidate>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="firstName">First Name</label>
                            <input type="text" id="firstName" name="firstName" placeholder="Enter your first name">
                            <span class="error" id="firstNameError"></span>
                        </div>

                        <div class="form-group">
                            <label for="lastName">Last Name</label>
                            <input type="text" id="lastName" name="lastName" placeholder="Enter your last name">
                            <span class="error" id="lastNameError"></span>
                        </div>

                        <div class="form-group full-width">
                            <label for="address">Address</label>
                            <input type="text" id="address" name="address" placeholder="Enter your address">
                            <span class="error" id="addressError"></span>
                        </div>

                        <div class="form-group">
                            <label for="city">City</label>
                            <input type="text" id="city" name="city" placeholder="Enter your city">
                            <span class="error" id="cityError"></span>
                        </div>

                        <div class="form-group">
                            <label for="postalCode">Postal Code</label>
                            <input type="text" id="postalCode" name="postalCode" placeholder="A1A1A1" maxlength="6">
                            <span class="error" id="postalCodeError"></span>
                        </div>

                        <div class="form-group">
                            <label for="province">Province</label>
                            <input type="text" id="province" name="province" placeholder="ON" maxlength="2">
                            <span class="error" id="provinceError"></span>
                        </div>

                        <div class="form-group">
                            <label for="age">Age</label>
                            <input type="number" id="age" name="age" placeholder="Enter your age" min="0">
                            <span class="error" id="ageError"></span>
                        </div>

                        <div class="form-group full-width">
                            <label for="email">Email</label>
                            <input type="text" id="email" name="email" placeholder="example@email.com">
                            <span class="error" id="emailError"></span>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" placeholder="Enter your password">
                            <span class="error" id="passwordError"></span>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password">
                            <span class="error" id="confirmPasswordError"></span>
                        </div>
                    </div>

                    <div class="button-row">
                        <button type="submit" class="btn btn-primary">Register Now</button>
                        <button type="reset" class="btn btn-secondary">Clear Form</button>
                    </div>
                </form>
            </section>
        </main>

        <footer class="footer">
            <p>&copy; Janet Adewusi</p>
        </footer>
    </div>

    <script src="assignment4.js"></script>
</body>
</html>
